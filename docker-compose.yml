version: "3.11.9"

services:
  api:
    build: .
    container_name: task_manager_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/taskmanager
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:15
    container_name: task_manager_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
